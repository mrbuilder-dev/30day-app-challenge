<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Hard neo-brutalist drop shadow -->
  <circle cx="53" cy="53" r="42" fill="#000000" />
  
  <!-- Yellow circle badge with thick border -->
  <circle cx="50" cy="50" r="42" fill="#fdcf55" stroke="#000000" stroke-width="5" />
  
  <!-- Central Flare / Sun Core -->
  <circle cx="50" cy="50" r="8" fill="#000000" />
  
  <!-- 4 Main Orthogonal Rays -->
  <rect x="47.5" y="22" width="5" height="14" rx="1.5" transform="rotate(0 50 50)" fill="#000000" />
  <rect x="47.5" y="22" width="5" height="14" rx="1.5" transform="rotate(90 50 50)" fill="#000000" />
  <rect x="47.5" y="22" width="5" height="14" rx="1.5" transform="rotate(180 50 50)" fill="#000000" />
  <rect x="47.5" y="22" width="5" height="14" rx="1.5" transform="rotate(270 50 50)" fill="#000000" />
  
  <!-- 4 Diagonal Secondary Rays -->
  <rect x="48" y="27" width="4" height="9" rx="1" transform="rotate(45 50 50)" fill="#000000" />
  <rect x="48" y="27" width="4" height="9" rx="1" transform="rotate(135 50 50)" fill="#000000" />
  <rect x="48" y="27" width="4" height="9" rx="1" transform="rotate(225 50 50)" fill="#000000" />
  <rect x="48" y="27" width="4" height="9" rx="1" transform="rotate(315 50 50)" fill="#000000" />
</svg>
